<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 · 兑换码与功能权限</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="boot" class="boot" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span>正在检查登录状态…</span>
  </div>

  <section id="login-view" class="login-view hidden" aria-label="管理员登录">
    <form id="login-form" class="login-card" autocomplete="off" novalidate>
      <div class="login-brand">
        <span class="brand-mark brand-mark--lg" aria-hidden="true">管</span>
        <h1 class="login-title">管理后台</h1>
        <p class="login-sub">兑换码与功能权限管理</p>
      </div>
      <label class="field">
        <span class="field-label">管理员口令</span>
        <input id="login-password" name="password" type="password" class="input"
               placeholder="请输入管理员口令" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error hidden" role="alert"></p>
      <button id="login-submit" class="btn btn-primary btn-block" type="submit">登录</button>
      <p class="login-note">会话有效期 8 小时；同一 IP 连续失败 5 次将锁定 10 分钟。</p>
    </form>
  </section>

  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">管</span>
          <span class="brand-text">管理后台</span>
        </div>
        <nav id="main-nav" class="nav" aria-label="主导航">
          <a href="#/overview" data-route="overview">概览</a>
          <a href="#/codes" data-route="codes">兑换码</a>
          <a href="#/matrix" data-route="matrix">功能权限</a>
          <a href="#/features" data-route="features">功能目录</a>
          <a href="#/audit" data-route="audit">操作审计</a>
        </nav>
        <div class="topbar-actions">
          <span id="actor-label" class="actor muted"></span>
          <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">退出登录</button>
        </div>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root" class="modal-root hidden"></div>

  <script src="./app.js"></script>
</body>
</html>
