// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        jcenter()
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.0'
        classpath 'com.android.tools.build:gradle-experimental:0.11.1'
        classpath files('./security/messProguard.jar')
        classpath 'com.github.megatronking.stringfog:gradle-plugin:2.2.1'
        classpath 'com.github.megatronking.stringfog:xor:1.1.0'
    }
}

plugins {
    // 依赖更新报告（质量门禁第一梯队）：`./gradlew dependencyUpdates`
    // 0.46.0 为兼容 Gradle 7.3.3 的版本；插件经 Gradle Plugin Portal 解析（见 T5 报告的离线说明）
    id 'com.github.ben-manes.versions' version '0.46.0'
}

apply from: 'VAConfig.gradle'
apply from: 'AppConfig.gradle'

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
}

// 依赖更新报告：只报告稳定版更新（alpha/beta/rc 默认过滤；需要时 -Drevision=all 放开）
dependencyUpdates {
    revision = 'release'
    outputFormatter = 'plain'
    outputDir = "${rootProject.buildDir}/dependencyUpdates"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
