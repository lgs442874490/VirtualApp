plugins {
    // 质量门禁第一梯队：失败重试（只给 flaky 用例兜底，不允许掩盖真实回归）
    id 'org.gradle.test-retry' version '1.5.1'
}

apply plugin: 'com.android.application'

android {
    //compileSdkVersion 29
    //buildToolsVersion '29.0.1'

    signingConfigs {
        release {
            storeFile file(rootProject.ext.signing_storeFile)
            storePassword rootProject.ext.signing_storePassword
            keyAlias = rootProject.ext.signing_keyAlias
            keyPassword rootProject.ext.signing_keyPassword
        }
        debug {
            storeFile file(rootProject.ext.signing_storeFile)
            storePassword rootProject.ext.signing_storePassword
            keyAlias = rootProject.ext.signing_keyAlias
            keyPassword rootProject.ext.signing_keyPassword
        }
    }
    
    defaultConfig {
        applicationId rootProject.ext.PACKAGE_NAME
        //minSdkVersion 15
        //targetSdkVersion 32
        versionCode rootProject.ext.VA_VERSION_CODE
        versionName rootProject.ext.VA_VERSION

        //renderscriptTargetApi 19
        //renderscriptSupportModeEnabled true

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        buildConfigField 'String', 'PACKAGE_NAME', '"' + rootProject.ext.PACKAGE_NAME + '"'
        buildConfigField 'String', 'EXT_PACKAGE_NAME', '"' + rootProject.ext.EXT_PACKAGE_NAME + '"'
        buildConfigField 'String', 'VA_VERSION_NAME', '"V' + rootProject.ext.VA_VERSION + '"'
        // 授权服务端基址（域名根，**不含 /v1 后缀、不含结尾斜杠**）。
        // 客户端请求地址 = BASE_URL + "/v1/activate|verify|rebind"，
        // 与服务端路由 "POST /v1/..." 及 Caddy reverse_proxy 直通一致，
        // 故此处绝不能带 /v1，否则会拼成 /v1/v1/... 而 404。
        // 客户端 LicenseConfig.BASE_URL 取自本字段；调试期可用
        // filesDir/license_endpoint.txt 临时覆盖，无需重新打包。
        buildConfigField 'String', 'LICENSE_BASE_URL', '"https://cs.888syd.xyz"'
        //buildConfigField 'String', 'PACKAGE_NAME_ARM64', '"' + rootProject.ext.EXT_PACKAGE_NAME + '"'
        manifestPlaceholders = [
                PACKAGE_NAME_32BIT: rootProject.ext.PACKAGE_NAME,
                PACKAGE_NAME_ARM64: rootProject.ext.EXT_PACKAGE_NAME,
                VA_ACCESS_PERMISSION_NAME: rootProject.ext.VA_ACCESS_PERMISSION_NAME,
        ]
        //ndk {
            //abiFilters rootProject.ext.VA_VERSION_64?"arm64-v8a":"armeabi-v7a"//"arm64-v8a","armeabi", "armeabi-v7a", "x86"  //兼容Android 10
            //abiFilters "armeabi-v7a", "x86" , "x86_64"
        //}

        if (rootProject.ext.VA_MAIN_PACKAGE_32BIT) {
            ndk.abiFilters = ["armeabi-v7a"]
        } else {
            ndk.abiFilters = ["arm64-v8a"]
        }
        signingConfig signingConfigs.release
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        debug {
            //debuggable true
            jniDebuggable false
            minifyEnabled false
            zipAlignEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../security/proguard-rules.pro' //'proguard-rules.pro', 'virtualapp-proguard-rules.pro','../security/proguard-rules.pro' //
        }
        release {
            debuggable true   // 恒开：run-as 调试容器数据/导出快照依赖此标记
            jniDebuggable true
            minifyEnabled true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../security/proguard-rules.pro' //'proguard-rules.pro', 'virtualapp-proguard-rules.pro','../security/proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false  // 如果发现 lint 错误，不中止编译
        checkReleaseBuilds false  // 禁用发布版本的 lint 检查
        xmlReport true  // 生成 XML 格式的报告
        htmlReport true  // 生成 HTML 格式的报告
    }
    lintOptions {
        abortOnError false
    }
    testOptions {
        unitTests {
            // 纯逻辑类（AccountImport/EntryLayout/SessionProbe/codec 等）在 JVM 上直跑；
            // 少数路径里的 android.util.Log 等静态调用返回默认值即可。
            returnDefaultValues = true
        }
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'

        // 解决资源冲突
       // exclude 'META-INF/metadata.jvm.kotlin_module'
        //exclude 'META-INF/*.kotlin_module' // 也可以尝试排除所有相关的kotlin_module文件
    }
}


repositories {
    flatDir {
        dirs 'sdk'
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation(name:'lib-release', ext:'aar')
    //Android Lib
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'

    //Lifecycles, LiveData, and ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.lifecycle:lifecycle-common-java8:2.2.0"
    //Room
    implementation 'androidx.room:room-runtime:2.2.5'
    annotationProcessor 'androidx.room:room-compiler:2.2.5'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"//导入Retrofit
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"//转换器，请求结果转换成VO
    implementation "com.squareup.retrofit2:converter-scalars:2.9.0"//转换器，请求结果转换成原始json字符串
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.9.0"//配合Rxjava使用，将retofit的call映射成Observable

    /*okhttp 网络 请求封装包*/
    implementation 'com.squareup.okhttp3:okhttp:3.4.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    //google 的gson 库
    implementation 'com.google.code.gson:gson:2.8.4'

    //Promise Support
    implementation 'org.jdeferred:jdeferred-android-aar:1.2.4'

    //StringFog
    implementation 'com.github.megatronking.stringfog:xor:1.1.0'

    //fastjson
    implementation 'com.alibaba:fastjson:1.2.59'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.7.1'
    implementation files('libs/pinyin4j-2.5.0.jar')

    // ---------- 单元测试（JVM 纯逻辑层，见 qa/测试用例-全量-v3.8.0.md） ----------
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    // 真实 org.json（覆盖 android.jar 桩）：AccountPoolCache 的 /accounts shape
    // 解析辅助（isRoleOnline 等）需要真实 JSON 解析（M4 §3.1 单测要求真实 fixture）
    testImplementation 'org.json:json:20240303'

}

// ================= 质量门禁第一梯队（app 侧） =================
// app 覆盖率（JaCoCo）本次未落地：AGP 7.2 单测覆盖率数据路径/报告任务验证超出时间盒，
// 为避免给日常 debug 构建加插桩、且不留“空报告任务”，app coverage 明确记为第二梯队。
// 本次仅保留 test-retry（配置已验证可加载；失败重试触发路径待有 flaky 用例时验证）。

// Android 单元测试任务统一启用 retry（仅 flaky；与 root/vault-server 同口径）
tasks.configureEach { t ->
    if (t instanceof org.gradle.api.tasks.testing.Test) {
        t.retry {
            maxRetries = 2
            maxFailures = 5
            failOnPassedAfterRetry = false
        }
    }
}

// ================= 引擎补丁 AAR 强制门禁（autofill ANR 修复必须进包） =================
// 背景（2026-11-04）：容器内 View.layout → notifyEnterOrExitForAutoFillIfNeeded →
// AutofillManager.startSessionLocked 死等 5s → Input dispatch ANR → 分身进程被杀。
// 修复（libvbox.so 换补丁版 + classes.jar 两处 autofill 字节码补丁）早已在
// tools/engine/lib-release.aar.patched 里，但 2026-11-04 那次手工 assembleRelease
// 绕过了 tools/release.sh 门禁 2，产物里 so 是原版、dex 里仍跳过 AutoFillManagerStub
// 注册 ⇒ 事故复发。
//
// 因此把校验下沉到 Gradle：挂在 preBuild（所有 variant、debug/release、任意 worktree、
// 手工 assembleXxx 都必须先过），仓库 AAR 不是补丁版就直接 fail，并打印修复指引。
// 纯 Gradle 实现（java.security.MessageDigest），不联网、不依赖外部命令。
def ENGINE_AAR_FILE = file('sdk/lib-release.aar')
def ENGINE_AAR_SHA256 = 'ccc4431945e4ea5cc7da4d3400380fa148e6e499af9f7935970962829e825b10'

def sha256Hex = { File f ->
    def md = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { ins ->
        byte[] buf = new byte[65536]
        int n
        while ((n = ins.read(buf)) > 0) {
            md.update(buf, 0, n)
        }
    }
    return md.digest().collect { String.format('%02x', it) }.join()
}

tasks.register('verifyEngineAar') {
    group = 'verification'
    description = '校验 app/sdk/lib-release.aar 是补丁引擎 AAR（含 autofill ANR 修复），否则构建失败'
    // 不声明 inputs/outputs：每次构建都真跑一遍，避免被 up-to-date 检查跳过
    doLast {
        if (!ENGINE_AAR_FILE.exists()) {
            throw new GradleException(
                    "【引擎门禁】找不到引擎 AAR：${ENGINE_AAR_FILE}\n" +
                    "请执行：git checkout -- app/sdk/lib-release.aar")
        }
        def actual = sha256Hex(ENGINE_AAR_FILE)
        if (actual != ENGINE_AAR_SHA256) {
            throw new GradleException("""
【引擎门禁】app/sdk/lib-release.aar 不是补丁版引擎 AAR，构建已中止。
  实际 sha256 = ${actual}
  期望 sha256 = ${ENGINE_AAR_SHA256}
为什么必须拦：仓库原版 AAR（sha256 06531a73…）里 libvbox.so 是原版、classes.jar
里 InvocationStubManager 仍按 BuildCompat.isTiramisu() 跳过 AutoFillManagerStub 注册，
用它构建出的 APK 会在容器内触发 autofill startSession 5s 死等 → Input dispatch ANR
→ 分身闪退（2026-11-04 事故）。
修复（任选其一，都不需要联网）：
  1) python3 tools/engine/patch_engine.py       # 以当前 AAR 为基座重建补丁包
     cp tools/engine/lib-release.aar.patched app/sdk/lib-release.aar
  2) tools/release.sh                            # 发版流程，门禁 2 会自动就位并校验
  3) 直接取现成产物：cp tools/engine/lib-release.aar.patched app/sdk/lib-release.aar
完成后 sha256 应等于 ${ENGINE_AAR_SHA256}
""")
        }
        logger.lifecycle("[gate] 引擎 AAR 校验通过：lib-release.aar = ${ENGINE_AAR_SHA256}（补丁版，含 autofill ANR 修复）")
    }
}

afterEvaluate {
    // preBuild 是所有 variant 的 assemble/compile 链路起点；挂在这里保证任何构建方式都过闸
    tasks.named('preBuild').configure { dependsOn 'verifyEngineAar' }
}

